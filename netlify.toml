[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  NEXT_TELEMETRY_DISABLED = "1"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Redirect bare /day to today's session (handled by app, but belt-and-suspenders)
[[redirects]]
  from = "/day"
  to = "/dashboard"
  status = 302
